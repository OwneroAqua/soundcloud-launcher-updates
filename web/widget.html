<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
    :root {
        --accent: #ff5500;
        --opacity: 0.94;
    }
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
        width: 100vw;
        height: 100vh;
        background: rgba(14, 14, 20, var(--opacity));
        color: #f4f4f6;
        font-family: 'Segoe UI', system-ui, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 11px 13px;
        position: relative;
    }
    .bg-glow {
        position: absolute;
        inset: -30px;
        background: radial-gradient(circle at top left, var(--accent), transparent 65%);
        opacity: 0.22;
        pointer-events: none;
        z-index: 0;
    }
    .top-row {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .cover-box {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: #1d1d26;
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cover-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
    }
    .meta {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .title {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .artist {
        font-size: 11px;
        color: #9b9ba8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .win-actions {
        display: flex;
        gap: 4px;
        align-self: flex-start;
    }
    .w-btn {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: #cbd5e1;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .w-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .progress-wrap {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        color: #9b9ba8;
        margin: 4px 0 2px;
    }
    .bar {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        cursor: pointer;
        overflow: hidden;
    }
    .fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        border-radius: 3px;
        transition: width 0.2s linear;
    }

    .controls-row {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
    }
    .c-btn {
        background: none;
        border: none;
        color: #d4d4dc;
        cursor: pointer;
        padding: 4px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .c-btn:hover { color: var(--accent); background: rgba(255, 255, 255, 0.06); }
    .play-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 12px rgba(255, 85, 0, 0.4);
    }
    .play-circle:hover { transform: scale(1.06); }
</style>
</head>
<body class="pywebview-drag-region">
    <div class="bg-glow"></div>

    <div class="top-row">
        <div class="cover-box">
            <img id="w-cover" src="" alt="">
            <svg id="w-note" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="meta">
            <div class="title" id="w-title">SoundCloud Launcher</div>
            <div class="artist" id="w-artist">Выберите трек в лаунчере</div>
        </div>
        <div class="win-actions">
            <button type="button" class="w-btn" onclick="pywebview.api.show_main_from_widget()" title="Развернуть лаунчер">↗</button>
            <button type="button" class="w-btn" onclick="pywebview.api.toggle_widget()" title="Скрыть мини-плеер (Alt+M)">✕</button>
        </div>
    </div>

    <div class="progress-wrap">
        <span id="w-cur">0:00</span>
        <div class="bar" id="w-bar" onclick="onBarClick(event)">
            <div class="fill" id="w-fill"></div>
        </div>
        <span id="w-dur">0:00</span>
    </div>

    <div class="controls-row">
        <button type="button" class="c-btn" onclick="pywebview.api.widget_command('prev', 0)" title="Предыдущий">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button type="button" class="play-circle" id="w-play" onclick="pywebview.api.widget_command('toggle', 0)" title="Пауза / Старт">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" class="c-btn" onclick="pywebview.api.widget_command('next', 0)" title="Следующий">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

<script>
    const PLAY_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const PAUSE_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    function fmt(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0');
    }

    function onBarClick(e) {
        const rect = document.getElementById('w-bar').getBoundingClientRect();
        const pct = ((e.clientX - rect.left) / rect.width) * 100;
        pywebview.api.widget_command('seek', pct);
    }

    function applyWidgetSettings(s) {
        if (!s) return;
        if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
        if (s.widget_opacity) document.documentElement.style.setProperty('--opacity', s.widget_opacity);
    }

    function updateWidgetState(st) {
        if (!st) return;
        document.getElementById('w-title').innerText = st.title || 'Без названия';
        document.getElementById('w-artist').innerText = (st.artist || 'SoundCloud').replace(/•.*$/, '').trim();
        document.getElementById('w-play').innerHTML = st.is_playing ? PAUSE_SVG : PLAY_SVG;
        if (st.accent) document.documentElement.style.setProperty('--accent', st.accent);

        const cov = document.getElementById('w-cover');
        const note = document.getElementById('w-note');
        if (st.artwork) {
            cov.src = st.artwork;
            cov.style.display = 'block';
            note.style.display = 'none';
        } else {
            cov.style.display = 'none';
            note.style.display = 'block';
        }

        const dur = st.duration || 0;
        const el = st.elapsed || 0;
        document.getElementById('w-cur').innerText = fmt(el);
        document.getElementById('w-dur').innerText = fmt(dur);
        document.getElementById('w-fill').style.width = dur > 0 ? Math.min(100, (el / dur) * 100) + '%' : '0%';
    }
</script>
</body>
</html>
